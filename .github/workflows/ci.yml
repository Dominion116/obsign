name: CI

# All builds, typechecks, lint, and tests run here — never locally (RULE-1).

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: typecheck · lint · format · purity · test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install

      - name: Core purity (INV-1)
        run: npm run check:core-purity

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Test (golden vectors + suites)
        run: npm test

  # Cross-platform receiptId equality (INV-2). Recomputes every golden vector on
  # Linux and Windows and asserts the receiptIds are byte-identical across OSes.
  determinism:
    name: cross-platform receiptId equality
    needs: workspace
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install
      - name: Emit receiptId digest for all vectors
        run: npm run receipt:digest > digest-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.os }}
          path: digest-${{ matrix.os }}.txt

  compare-digests:
    name: compare cross-platform digests
    needs: determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
      - name: Assert Linux and Windows digests are identical
        run: |
          diff digest-ubuntu-latest.txt digest-windows-latest.txt \
            && echo "receiptIds are byte-identical across platforms" \
            || (echo "cross-platform receiptId mismatch" && exit 1)

  contracts:
    name: foundry contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check for a Foundry project
        id: detect
        run: |
          if [ -f contracts/foundry.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No contracts/foundry.toml yet (Phase 2). Skipping Foundry tests."
          fi

      - name: Install Foundry
        if: steps.detect.outputs.present == 'true'
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install forge-std
        if: steps.detect.outputs.present == 'true'
        working-directory: contracts
        run: |
          if [ ! -d lib/forge-std ]; then
            forge install foundry-rs/forge-std --no-commit || forge install foundry-rs/forge-std
          fi

      - name: Format check (forge fmt)
        if: steps.detect.outputs.present == 'true'
        working-directory: contracts
        run: forge fmt --check

      - name: Build contracts
        if: steps.detect.outputs.present == 'true'
        working-directory: contracts
        run: forge build --sizes

      - name: Test contracts (unit + fuzz + immutability)
        if: steps.detect.outputs.present == 'true'
        working-directory: contracts
        # Secret-free: the reorg fork test self-skips when BASE_SEPOLIA_RPC_URL is
        # unset, so this gate passes on fork PRs without any secrets.
        run: forge test -vvv

      - name: Coverage summary
        if: steps.detect.outputs.present == 'true'
        working-directory: contracts
        continue-on-error: true
        run: forge coverage --report summary
