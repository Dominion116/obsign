name: Deploy testnet

# Manual, secret-gated deploy of the Obsign contracts to Base Sepolia.
# RULE-1: deploys run here (CI) or via a human — never as a local build step.
# Trigger: Actions tab → "Deploy testnet" → Run workflow.

on:
  workflow_dispatch:
    inputs:
      verify:
        description: 'Verify on BaseScan after deploy'
        type: boolean
        default: true

concurrency:
  group: deploy-testnet
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy + verify (Base Sepolia)
    runs-on: ubuntu-latest
    # Requires repo secrets: DEPLOYER_PRIVATE_KEY (funded testnet key),
    # BASE_SEPOLIA_RPC_URL, BASESCAN_API_KEY.
    environment: base-sepolia
    steps:
      - uses: actions/checkout@v4

      - name: Guard — secrets present
        env:
          RPC: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: |
          if [ -z "$RPC" ] || [ -z "$KEY" ]; then
            echo "Missing DEPLOYER_PRIVATE_KEY / BASE_SEPOLIA_RPC_URL secrets." >&2
            exit 1
          fi

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Install forge-std
        working-directory: contracts
        run: |
          if [ ! -d lib/forge-std ]; then
            forge install foundry-rs/forge-std --no-commit || forge install foundry-rs/forge-std
          fi

      - name: Dry run (simulate + gas, no broadcast)
        working-directory: contracts
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
        run: forge script script/Deploy.s.sol:Deploy --rpc-url base_sepolia

      - name: Deploy (broadcast)
        working-directory: contracts
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
        run: forge script script/Deploy.s.sol:Deploy --rpc-url base_sepolia --broadcast

      - name: Verify on BaseScan (Etherscan V2)
        if: ${{ inputs.verify }}
        working-directory: contracts
        # Non-fatal: the on-chain deploy already succeeded and addresses are
        # captured below regardless. Verifies exactly the addresses just written
        # to deployments/84532.json (no redeploy), via the V2 endpoint in
        # foundry.toml. No constructor args on any contract.
        continue-on-error: true
        env:
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
        run: |
          ANCHOR=$(jq -r .anchor deployments/84532.json)
          REVOCATION=$(jq -r .revocation deployments/84532.json)
          REGISTRY=$(jq -r .issuerRegistry deployments/84532.json)
          POLICY=$(jq -r .policyRegistry deployments/84532.json)
          forge verify-contract "$ANCHOR" src/ObsignAnchor.sol:ObsignAnchor --chain base-sepolia --watch
          forge verify-contract "$REVOCATION" src/ObsignRevocation.sol:ObsignRevocation --chain base-sepolia --watch
          forge verify-contract "$REGISTRY" src/ObsignIssuerRegistry.sol:ObsignIssuerRegistry --chain base-sepolia --watch
          forge verify-contract "$POLICY" src/ObsignPolicyRegistry.sol:ObsignPolicyRegistry --chain base-sepolia --watch

      - name: Upload deployments artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: deployments-84532
          path: contracts/deployments/84532.json

      - name: Open PR with updated addresses
        if: ${{ always() }}
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/deploy-84532
          title: 'chore(contracts): update Base Sepolia deployment addresses'
          commit-message: 'chore(contracts): update deployments/84532.json from testnet deploy'
          body: |
            Automated from the Deploy testnet workflow. Review the addresses and
            confirm they are verified on BaseScan Sepolia before merging.
          add-paths: |
            contracts/deployments/84532.json
